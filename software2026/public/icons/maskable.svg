<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fit Vita 마스커블 아이콘 (안드로이드가 원·물방울 등으로 잘라도 글자가 안전 영역 안에 들어가도록 여백을 둠) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8F27D"/>
      <stop offset="0.5" stop-color="#5DCB6A"/>
      <stop offset="1" stop-color="#16945A"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <g id="mark" transform="translate(256 256) scale(0.74) translate(-259 -266)">
