<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fit Vita 앱 아이콘 (둥근 모서리, 일반 아이콘·파비콘용): 곡선 F + 새싹 V -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8F27D"/>
      <stop offset="0.5" stop-color="#5DCB6A"/>
      <stop offset="1" stop-color="#16945A"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <g id="mark" transform="translate(256 256) scale(1) translate(-259 -266)">
    <!-- 곡선 F -->
    <g fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 380 V214 C96 178 120 152 156 152 H204"/>
      <path d="M96 266 H178"/>
    </g>
    <!-- 잎 두 장으로 만든 새싹 V -->
    <path d="M320 392 C262 340 236 250 256 150 C318 192 344 290 320 392 Z" fill="#FFFFFF"/>
    <path d="M320 392 C326 296 362 206 424 154 C440 250 398 340 320 392 Z" fill="#FFFFFF" opacity="0.82"/>
    <g fill="none" stroke="#5DCB6A" stroke-width="6" stroke-linecap="round">
      <path d="M314 360 C306 300 290 240 268 186"/>
      <path d="M330 360 C346 292 374 236 410 190"/>
    </g>
  </g>
</svg>
